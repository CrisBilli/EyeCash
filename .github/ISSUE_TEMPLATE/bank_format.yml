name: Bank or broker file not recognised
description: Help EyeCash read the export of your bank or broker
labels: [import]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach your real file.** Only the column headers and, if useful, one or two rows with invented values.
  - type: input
    id: bank
    attributes:
      label: Bank or broker, and the name of the export
      placeholder: "e.g. Banca X, 'Lista movimenti' Excel export"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What the file contains
      options: [Account / card transactions, Portfolio positions, Securities buy/sell movements, Other]
  - type: textarea
    id: headers
    attributes:
      label: Column headers (and invented sample rows)
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What EyeCash did
