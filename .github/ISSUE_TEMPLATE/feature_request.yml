name: Feature request
description: Suggest an idea for EyeCash
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or the question you want EyeCash to answer.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Would this need data to leave the device or the server? EyeCash keeps that to the minimum, see CONTRIBUTING.md.
